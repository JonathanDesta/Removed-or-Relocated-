# Makes the package installable: `pip install -e .` from the repo root,
# after which `import algoverse` works from anywhere. The scripts also put
# src/ on sys.path themselves, so a plain checkout runs them without an
# install (the notebook relies on that). Heavy dependencies (torch,
# transformers, lm-eval) are deliberately NOT declared here: the
# scoring/analysis half of the package runs without them, and each
# environment (GPU session, laptop) installs what it needs from
# requirements.txt.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algoverse"
version = "0.1.0"
description = "Removed or Recoverable? Testing layer-local suppression of deceptive behavior under retraining"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The vendored insider-trading scaffold (default.json, ATTRIBUTION.md) is read
# from the package directory at run time, so an installed algoverse carries it.
algoverse = ["insider_scaffold/*"]
