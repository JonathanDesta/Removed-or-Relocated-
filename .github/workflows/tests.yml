name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The analysis half of the package runs with no dependencies at all. These
  # suites insert src/ on sys.path themselves, so there is deliberately no
  # install step here — if this job ever needs one, that property has broken.
  pure:
    name: pure (no dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run the dependency-free suites
        run: |
          fail=0
          for f in tests/test_*_pure.py tests/test_metrics.py; do
            echo "--- $f"
            python3 "$f" || fail=1
          done
          exit $fail

  full:
    name: full suite (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e .

      # Every suite but one builds tiny randomly-initialized models on CPU and
      # downloads nothing. Running them with the offline flags set is what
      # proves it: if a suite ever starts reaching for the Hub, this job fails
      # rather than silently depending on a warm cache.
      - name: pytest (offline — no model downloads)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: pytest tests -q --deselect tests/test_wikitext_loader.py

      # The exception, by design: test_wikitext_loader.py is an acceptance test
      # for the pinned WikiText-2 loader, so it fetches the real dataset split
      # (~4.4 MB) and the production Qwen tokenizer. Its own docstring makes a
      # network failure a real failure, so it runs online and on its own.
      - name: Cache the HuggingFace hub
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-wikitext-qwen-tokenizer-v1
      - name: pytest (online — pinned WikiText-2 loader only)
        run: pytest tests/test_wikitext_loader.py -q
